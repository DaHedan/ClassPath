name: classpath
description: "课途 ClassPath —— 多端课程表软件"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0
  http: ^1.2.0
  qr_flutter: ^4.1.0
  # 二维码生成矩阵（schedule_share_service 离屏绘制用）
  qr: ^3.0.2
  # 本地 vendor 版：修复 AGP 9 + android.builtInKotlin=false 下 Kotlin 类不编译的问题
  file_picker:
    path: third_party/file_picker
  zxing2: ^0.2.4
  image: ^4.9.1
  mobile_scanner: ^7.4.0
  archive: ^4.0.9
  # 系统分享面板：手机端把课程表 json / 二维码图片发送到其它应用。
  # 12.x：兼容 vendor 版 file_picker 的 win32 ^5.x 约束（13.x 需要 win32 ^6）。
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# 用 assets/ClassPath_1024.png 一次性生成各平台应用图标。
# 运行：dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/ClassPath_1024.png"
  windows:
    generate: true
    image_path: "assets/ClassPath_1024.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/ClassPath_1024.png"
  linux:
    generate: true
    image_path: "assets/ClassPath_1024.png"
    icon_size: 512
  web:
    generate: true
    image_path: "assets/ClassPath_1024.png"

flutter:
  uses-material-design: true
  # 图标也随应用打包，Linux 端用它作为 GTK 窗口图标。
  assets:
    - assets/ClassPath_1024.png
